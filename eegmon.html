<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d27"><title>EEGMON</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071d27}iframe{display:block;width:100%;height:100dvh;border:0}</style></head><body>
<audio id="intro-music" src="eegmon-intro.mp3?v=original-full-20261104" preload="auto" hidden></audio>
<iframe id="game" title="EEGMON" src="eeg-quest.html?parentAudio=1&v=original-full-20261104" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('game'),track=document.getElementById('intro-music');
let intro=true,soundReady=false;
track.volume=.7;
function rewind(){if(track.readyState)track.currentTime=track.duration>20?20:0}
track.addEventListener('loadedmetadata',rewind);
track.addEventListener('ended',()=>{rewind();playIntro()});
function playIntro(){if(intro&&!document.hidden)track.play().then(()=>{soundReady=true;frame.contentWindow.postMessage({type:'eeg-quest:audio-ready'},location.origin)}).catch(()=>{})}
frame.addEventListener('load',()=>{if(soundReady)frame.contentWindow.postMessage({type:'eeg-quest:audio-ready'},location.origin);playIntro()});
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==frame.contentWindow)return;
 if(e.data?.type==='eeg-quest:close'){track.pause();location.href='./'}
 if(e.data?.type==='eeg-quest:intro'){intro=!!e.data.playing;if(intro)playIntro();else{track.pause();rewind()}}
 if(e.data?.type==='eeg-quest:unlock-audio')playIntro();
});
document.addEventListener('pointerdown',playIntro,{capture:true});
document.addEventListener('keydown',playIntro,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)track.pause();else playIntro()});
playIntro();
</script></body></html>
