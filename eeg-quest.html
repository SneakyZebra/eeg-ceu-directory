.screen{border:0;aspect-ratio:10/9;background:#f8f8ed;box-shadow:0 0 0 4px #203b36,0 0 0 7px #9ba88a,0 16px 45px #0007;position:relative}
#gb-viewport{position:absolute;left:0;top:0;width:320px;height:288px;transform-origin:top left;color:#181818;background:#f8f8ed;font-family:QuestPixel,monospace;-webkit-font-smoothing:none}
#gb-viewport button{font-family:QuestPixel,monospace;color:#181818;border-radius:0;text-transform:uppercase}
.battle{display:grid;grid-template-rows:224px 64px;width:320px;height:288px}
.field{height:224px;background:#f8f8ed}
.field canvas{width:320px;height:224px;display:block;image-rendering:pixelated}
.status{position:absolute;font:12px/16px QuestPixel,monospace;letter-spacing:-.6px;color:#181818;background:transparent}
.enemy-status .name-row span:first-child{font-size:11px;letter-spacing:-1px}
.enemy-status{left:10px;top:20px;width:184px;padding:0 2px 6px 6px;border-left:3px solid #181818;border-bottom:3px solid #181818}
.player-status{left:166px;right:auto;top:163px;bottom:auto;width:146px;padding:0 5px 4px 0;border-right:3px solid #181818;border-bottom:3px solid #181818}
.name-row{gap:0;align-items:center;line-height:15px}
.level{font:10px/15px QuestPixel,monospace;letter-spacing:-1px}
.hp-row{gap:3px;margin-top:3px}
.hp-label{font:8px/8px QuestPixel,monospace;color:#c49c24;letter-spacing:-1px}
.hp-track{height:8px;border:2px solid #181818;background:#dadbc9}
.hp-fill{background:#54b882;transition:width .35s steps(8)}
.hp-fill.low{background:#c45445}
.hp-numbers{font:12px/15px QuestPixel,monospace;letter-spacing:-1px;margin-top:4px}
.player-status .xp-track{height:3px;margin-top:3px;background:#cdd4cf}
.player-status .xp-track i{background:#5c8ac4}
.wave-counter{display:none}
.command-box{position:relative;display:grid;grid-template-columns:176px 144px;border:0;height:64px;background:#f8f8ed;box-shadow:inset 0 0 0 2px #181818,inset 0 0 0 4px #f8f8ed,inset 0 0 0 6px #181818}
.dialogue{padding:9px 8px 7px 10px;display:block;position:static;min-width:0;font:12px/16px QuestPixel,monospace}
.dialogue p{font:12px/16px QuestPixel,monospace;letter-spacing:-.7px;max-height:48px;overflow:auto;overflow-wrap:anywhere;white-space:pre-line}
.dialogue>small{display:none}
.commands{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;padding:6px 5px 6px 13px;border:0;border-left:4px double #181818;align-content:stretch;position:relative}
.commands button{font:12px/16px QuestPixel,monospace!important;letter-spacing:-.8px;background:transparent!important;color:#181818;padding:3px 1px 3px 5px!important;min-height:0;height:auto;line-height:16px;overflow:visible;outline:none}
.commands button:hover,.commands button:focus{background:transparent!important}
.commands button:focus-visible{outline:1px dashed #6d826a}
.commands button::before{font:10px/12px QuestPixel,monospace!important;left:-5px!important;top:50%;color:#181818}
.commands button small{display:none}
.commands.moves{position:absolute;inset:0;display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);padding:5px 108px 9px 18px!important;border:0}
.commands.moves button{font-size:11px!important;letter-spacing:-.8px;white-space:nowrap;overflow-wrap:normal;padding:0 0 0 2px!important;line-height:12px}
.commands.moves::after{content:attr(data-detail);white-space:pre;position:absolute;right:5px;top:6px;width:93px;padding:5px 0 4px 8px;border-left:3px solid #181818;font:10px/20px QuestPixel,monospace;letter-spacing:-1px;pointer-events:none}
.battle:has(.commands.moves) .dialogue p{visibility:hidden}
.menu-back{position:absolute;left:7px;top:-20px;z-index:2;min-height:16px;height:16px;padding:2px 3px!important;background:#f8f8ed!important;border:1px solid #181818!important;font:8px/12px QuestPixel,monospace!important}
.commands.long{grid-template-columns:1fr;grid-template-rows:1fr}
.commands.long button{font-size:10px!important;white-space:normal}
.commands.long button small{display:block;font:6px/10px QuestPixel,monospace}
.title-screen{padding:13px 14px 8px;background:#e1ead1}
.title-eyebrow{font:6px/10px QuestPixel,monospace;letter-spacing:1px}
.title-screen h1{font:34px/.95 QuestPixel,monospace;letter-spacing:-3px;margin:12px 0 3px;transform:none;color:#f2ce58;text-shadow:2px 0 #203b36,-2px 0 #203b36,0 -2px #203b36,0 2px #203b36,3px 4px #203b36}
.title-screen h1 span{font-size:.9em}
.title-sub{font:8px/12px QuestPixel,monospace;letter-spacing:1px;margin:5px 0 0}
.title-art{width:270px;height:78px;flex-shrink:0;margin:3px 0}
.title-story{font:7px/11px QuestPixel,monospace;max-width:285px;margin:3px 0 8px}

// Pure game rules. Powers, charges and focus are invented arcade statistics.
class QuestBattle{
 constructor(random=Math.random){this.random=random;this.battlesUntilDefeat=3+Math.floor(this.random()*3);try{const saved=Number(localStorage.getItem('eegmon-defeat-countdown'));if(Number.isInteger(saved)&&saved>=1&&saved<=5)this.battlesUntilDefeat=saved}catch(e){}this.reset()}
 saveDefeatCountdown(){try{localStorage.setItem('eegmon-defeat-countdown',String(this.battlesUntilDefeat))}catch(e){}}
 reset(){this.defeatEncounter=false;this.attackTurns=0;this.screen='title';this.stage=0;this.focus=100;this.score=0;this.turns=0;this.guard=0;this.battleCount=6;this.partner=0;this.order=[0,1,2,3,4,5];this.moveIds=[0,1,2,3];this.charges=this.moves.map(m=>m.max);this.items=[3,2,2];this.enemyHP=0;this.seen=[]}
 shuffle(values){const out=[...values];for(let i=out.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
 begin(){this.reset();this.order=this.shuffle(QUEST_CREATURES.map((_,i)=>i)).slice(0,this.battleCount);this.screen='battle';this.encounter()}
 get moves(){return this.moveIds.map(i=>QUEST_MOVES[i])}
 get enemy(){return {...QUEST_CREATURES[this.order[this.stage]],name:QUEST_VILLAINS[this.order[this.stage]].name,level:4+this.stage*4,hp:[60,74,90,106,122,140][this.stage]*(this.defeatEncounter?2:1),attack:[13,15,17,19,22,25][this.stage]}}
 choosePartner(index){if(!Number.isInteger(index)||index<0||index>=QUEST_CREATURES.length)return false;this.partner=index;return true}
 encounter(){this.defeatEncounter=--this.battlesUntilDefeat<=0;if(this.defeatEncounter)this.battlesUntilDefeat=3+Math.floor(this.random()*3);this.saveDefeatCountdown();this.attackTurns=0;const previous=this.moveIds;this.moveIds=this.shuffle(QUEST_MOVES.map((_,i)=>i)).slice(0,4);if(this.moveIds.every(i=>previous.includes(i)))this.moveIds[3]=QUEST_MOVES.findIndex((_,i)=>!this.moveIds.includes(i));this.charges=this.moves.map(m=>m.max);this.enemyHP=this.enemy.hp;this.turns=0;this.guard=0;const id=this.order[this.stage];if(!this.seen.includes(id))this.seen.push(id)}
 act(kind,index){
  if(this.screen!=='battle')return {ok:false,text:'Choose a new patrol from the title screen.'};
  let dealt=0,restored=0,critical=false,text='';
  if(kind==='move'){
   const move=this.moves[index];if(!move||this.charges[index]<=0)return {ok:false,text:'No arcade charges left. Open KIT to recharge your moves.'};
   this.charges[index]--;this.attackTurns++;critical=this.random()<.12;
   dealt=Math.max(1,Math.round((move.power+Math.floor(this.random()*7)-2)*(critical?1.35:1)));
   dealt=Math.min(dealt,this.enemyHP);this.enemyHP-=dealt;
   text='EEG TECH used\n'+move.name.toUpperCase()+'!';if(critical)text+='\nA brilliant arcade hit!';
  }else if(kind==='item'){
   if(!Number.isInteger(index)||index<0||index>2||this.items[index]<=0)return {ok:false,text:'That toolkit supply is empty.'};
   if(index===0&&this.focus===100)return {ok:false,text:'Your focus is already full. Save the break for later.'};
   if(index===2&&this.focus===100&&this.charges.every((n,i)=>n===this.moves[i].max))return {ok:false,text:'Health and move charges are already full.'};
   this.items[index]--;
   if(index===0){restored=Math.min(40,100-this.focus);this.focus+=restored;text='A quiet FOCUS BREAK.\n'+restored+' focus points restored.'}
   if(index===1){this.guard=2;text='ARTIFACT SHIELD up!\nThe next two counterattacks are softened.'}
   if(index===2){restored=Math.min(40,100-this.focus);this.focus+=restored;this.charges=this.charges.map((n,i)=>Math.min(this.moves[i].max,n+3));text='RECHARGE complete!\n+'+restored+' HEALTH / +3 MOVE CHARGES';}
  }else return {ok:false,text:'Choose a battle command.'};
  this.turns++;
  if(this.enemyHP<=0){
   this.score+=150+this.stage*40+Math.max(0,9-this.turns)*15;
   this.screen=this.stage===this.battleCount-1?'complete':'won';
   return {ok:true,dealt,restored,critical,text,enemyDamage:0,victory:true,complete:this.screen==='complete'};
  }
  if(kind==='item'&&index===2)return {ok:true,dealt,restored,critical,text,enemyDamage:0,noCounterattack:true,defeat:false};
  let enemyDamage=this.enemy.attack+Math.floor(this.random()*8);const decisive=this.defeatEncounter&&kind==='move'&&this.attackTurns>=3;
  if(this.guard>0){enemyDamage=Math.max(1,Math.floor(enemyDamage*.35));this.guard--}
  if(decisive)enemyDamage=this.focus;
  enemyDamage=Math.min(this.focus,enemyDamage);this.focus-=enemyDamage;
  if(this.focus<=0){this.screen='defeat';this.battlesUntilDefeat=3+Math.floor(this.random()*3);this.saveDefeatCountdown()}
  return {ok:true,dealt,restored,critical,text,enemyDamage,decisive,defeat:this.screen==='defeat'};
 }
 next(){
  if(this.screen!=='won')return false;
  this.stage++;this.focus=Math.min(100,this.focus+36);
  this.screen='battle';this.encounter();return true;
 }
}

function updateSoundUI(){
 const ready=audioUnlocked&&!muted;
 $('sound').textContent=!audioUnlocked?'♫ ENABLE SOUND':muted?'♫ SOUND OFF':'♫ SOUND ON';
 $('sound').setAttribute('aria-label',ready?'Mute game audio':'Enable game audio');
 $('sound').setAttribute('aria-pressed',String(muted));
 $('start').querySelector('span').textContent='PRESS START';

function stopIntroSource(){introTrack.pause();if(introTrack.readyState)introTrack.currentTime=0}
function syncIntroSource(){
 if(window.parent!==window&&new URLSearchParams(location.search).has('parentAudio')){window.parent.postMessage({type:'eeg-quest:intro',playing:active&&!muted&&!document.hidden&&model.screen==='title'&&!$('title').hidden},location.origin);fitGoldViewport();return}
 if(active&&!muted&&!document.hidden&&model.screen==='title'&&!$('title').hidden){
  const attempt=introTrack.play();if(attempt&&attempt.then)attempt.then(()=>{audioUnlocked=true;updateSoundUI()}).catch(()=>{});
 }else stopIntroSource();

}
async function enableGameSound(){

 $('audio-status').textContent='ENABLING SOUND…';
 try{
  // Start media playback in the original user gesture, before awaiting anything.
  introTrack.muted=false;
  const mediaAttempt=model.screen==='title'?introTrack.play():Promise.resolve();
  initAudio();
  const contextAttempt=audio&&audio.state==='suspended'?audio.resume():Promise.resolve();
  await Promise.all([mediaAttempt,contextAttempt]);

  return true;
 }catch(e){
  audioUnlocked=false;muted=true;updateSoundUI();$('audio-status').textContent='SOUND DID NOT START · TAP SOUND TO RETRY';return false;
 }finally{enablingSound=false}
}
function requestStart(){

function pixelTraceSegment(g,x0,y0,x1,y1,size=1){
 x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
 const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let error=dx+dy;
 for(;;){g.fillRect(x0,y0,size,size);if(x0===x1&&y0===y1)break;const twice=2*error;if(twice>=dy){error+=dy;x0+=sx}if(twice<=dx){error+=dx;y0+=sy}}
}
function eegTraceOffset(position,row=0){
 const frequency=[.13,.2,.09,.16,.11,.23][row%6];
 return Math.sin(position*frequency)*6+Math.sin(position*frequency*.46+row)*3+Math.sin(position*.57)*1.5;
}
function drawIntroEEG(g,time){
 g.save();g.fillStyle='#9986a4';g.globalAlpha=.38;
 for(let row=0;row<6;row++){
  const base=27+row*43,phase=time*(row%2?22:15)+row*19;
  let lastX=0,lastY=base;
  for(let x=0;x<=320;x+=2){
   const p=x+phase,y=base+Math.round(eegTraceOffset(p,row));
   if(x)pixelTraceSegment(g,lastX,lastY,x,y);lastX=x;lastY=y;
  }
 }
 g.restore();
}

 initAudio();musicTimer=setInterval(()=>{
  if(model.screen==='title'||['complete','defeat'].includes(model.screen)||!active||document.hidden)return;
  const note=tune[musicStep%tune.length];if(note)tone(note,.11,'square');
  if(musicStep%4===0)tone([131,131,175,147][Math.floor(musicStep/8)%4],.24,'triangle');musicStep++;
 },160);
 const openingNote=tune[musicStep%tune.length];if(openingNote)tone(openingNote,.11,'square');
}
function stopMusic(){clearInterval(musicTimer);musicTimer=0}
function victoryTune(){[523,659,784,1046].forEach((n,i)=>tone(n,.16,'square',i*.12))}
function closeGame(){
 cancelWork();active=false;stopMusic();stopIntroSource();if(audio)audio.suspend().catch(()=>{});
 if(window.parent!==window)window.parent.postMessage({type:'eeg-quest:close'},location.origin);else location.href='./';
}
$('message').addEventListener('click',()=>{if(menu==='intro'&&!busy){say('What will EEG TECH do?');renderMenu('root')}});
$('menu-back').addEventListener('click',()=>{say('What will EEG TECH do?');renderMenu('root')});
$('start').addEventListener('click',requestStart);$('again').addEventListener('click',toTitle);$('exit').addEventListener('click',closeGame);
$('guide-back').addEventListener('click',()=>{view('battle');say('What will EEG TECH do?');renderMenu('root')});
$('sound').addEventListener('click',()=>{
 if(!audioUnlocked||muted){enableGameSound();return}
 muted=true;stopMusic();stopIntroSource();if(audio)audio.suspend().catch(()=>{});updateSoundUI();
});
document.addEventListener('visibilitychange',()=>{syncIntroSource();if(document.hidden){stopMusic();if(audio)audio.suspend().catch(()=>{})}else if(active&&model.screen!=='title'&&!['complete','defeat'].includes(model.screen)){initAudio();startMusic()}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;if(e.data?.type==='eeg-quest:open'){active=true;toTitle()}if(e.data?.type==='eeg-quest:audio-ready'){audioUnlocked=true;updateSoundUI()}if(e.data?.type==='eeg-quest:hide'){cancelWork();active=false;stopMusic();stopIntroSource();if(audio)audio.suspend().catch(()=>{})}});
document.addEventListener('keydown',e=>{
 if(!active||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.target.closest('button')&&['sound','exit','menu-back'].includes(e.target.closest('button').id)&&!e.key.startsWith('Arrow'))return;
 if(e.key==='Escape'||e.key==='Backspace'){
  e.preventDefault();if(busy)return;if(!$('guide').hidden){$('guide-back').click();return}
  if(model.screen==='battle'){say('What will EEG TECH do?');renderMenu('root')}else if(model.screen!=='title')toTitle();return;
 }
 if(busy)return;
 let buttons;
 if(!$('title').hidden)buttons=[$('start')];else if(!$('result').hidden)buttons=[$('again')];else if(!$('guide').hidden)buttons=[$('guide-back')];else buttons=Array.from($('commands').querySelectorAll('button:not(:disabled)'));
 if(!buttons.length)return;
 const focused=buttons.indexOf(document.activeElement);if(focused>=0)selected=focused;selected=Math.min(selected,buttons.length-1);
 if(e.key.startsWith('Arrow')){
  e.preventDefault();const verticalStep=['moves','kit','won','retreat'].includes(menu)?1:2;const shift=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-verticalStep:verticalStep;selected=(selected+shift+buttons.length)%buttons.length;buttons[selected].focus({preventScroll:true});
 }else if(/^[1-4]$/.test(e.key)){e.preventDefault();if(!e.repeat)buttons[Number(e.key)-1]?.click()}
 else if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(!e.repeat)buttons[selected].click()}
});
function unlockIntroFromGesture(e){
 if(!active||muted||model.screen!=='title')return;
 if(window.parent!==window&&new URLSearchParams(location.search).has('parentAudio'))window.parent.postMessage({type:'eeg-quest:unlock-audio'},location.origin);
 else syncIntroSource();
}
document.addEventListener('pointerdown',unlockIntroFromGesture,{capture:true});
document.addEventListener('keydown',unlockIntroFromGesture,{capture:true});
updateSoundUI();syncIntroSource();raf=requestAnimationFrame(frame);
