name: Remove Registry Prep Finder
on:
  push:
    paths:
      - '.github/workflows/remove-registry-prep-finder.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove Registry Prep Finder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          pattern=r'<details class="other-tab-finder" data-finder="registry-prep">.*?</details>'
          s,count=re.subn(pattern,'',s,flags=re.S)
          assert count==1, 'Expected one Registry Prep Finder'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove Registry Prep Finder with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
