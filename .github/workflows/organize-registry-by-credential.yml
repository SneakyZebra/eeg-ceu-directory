name: Organize registry preparation by credential
on:
  push:
    paths:
      - '.github/workflows/organize-registry-by-credential.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Add verified public EEG videos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,html
          from urllib.parse import urlparse
          p=Path('index.html');s=p.read_text()
          assert 'id="registry-cltm"' not in s
          start=s.index('<main',s.rfind('<main',0,s.index('id="registry-prep-view"')));end=s.index('</main>',start)+len('</main>');old=s[start:end]
          free=re.search(r'<div class="entries" id="registry-free">(.*?)</div></section>',old,re.S)[1]
          paid=re.search(r'<div class="entries" id="registry-paid">(.*?)</div></section>',old,re.S)[1]
          prefix=old[:old.index('<div class="grid">')].replace('<strong>EEG Registry Prep</strong>','<strong>Registry Prep</strong>')
          logos=json.loads(re.search(r'<script id="eeg-logo-data" type="application/json">(.*?)</script>',s,re.S)[1])
          def card(title,url,desc,badge):
           host=urlparse(url).hostname;logo=logos.get(host) or logos.get('www.'+host.removeprefix('www.')) or logos.get(host.removeprefix('www.')) or 'https://'+host+'/favicon.ico'
           esc=html.escape
           return '<article class="entry" data-reviewed="2026-11-05"><div class="logo"><img src="'+esc(logo,quote=True)+'" alt="'+esc(host)+' logo" loading="lazy"></div><div class="info"><strong>'+esc(title)+'</strong><p>'+esc(desc)+'</p><span class="tag">'+esc(badge)+'</span></div><a class="visit" href="'+esc(url,quote=True)+'" rel="noopener noreferrer" target="_blank">Visit Site</a></article>'
          common='https://abret.org/resources/handbooks'
          cltmfree=[
           ('ABRET CLTM Candidate Handbook',common,'Select the current CLTM handbook for the official examination outline, eligibility requirements and reference list.','Free official handbook'),
           ('Neuro Pathway CLTM Prep Classes','https://myneuropathway.com/cltm-prep-courses/','Free CLTM preparation sessions from credentialed educators. Check the schedule for future classes; listed past events do not establish current registration or recording access.','Free scheduled classes'),
           ('ACNS Critical Care EEG Terminology Training','https://www.acns.org/research/critical-care-eeg-monitoring-research-consortium-ccemrc/education','Training modules and self assessment covering critical care EEG terminology. A supporting CLTM study reference, not a complete exam preparation course.','Free training reference'),
           ('ASET LTM and Continuous EEG Competency Standards','https://www.aset.org/national-competency-skill-standards/','Select Long Term Monitoring in Epilepsy or adult and neonatal ICU continuous EEG standards to review technical competencies.','Free professional standards')]
          cltmpaid=[
           ('ABRET ASAP for CLTM','https://abret.org/asap','Select the CLTM assessment when purchasing access. Official ABRET practice questions and feedback to supplement other study materials.','Paid self assessment'),
           ('ASET LTM Flashcards, Fifth Edition','https://www.aset.org/product/qa-flashcard-study-system-for-long-term-monitoring-in-epilepsy-and-neurocritical-care-5th-edition-digital-flashcards/','Digital study cards covering long term monitoring, neurocritical care, quantitative EEG and troubleshooting. Six months of paid access.','Paid digital flashcards')]
          cnimfree=[
           ('ABRET CNIM Candidate Handbook',common,'Select the current CNIM handbook for the official examination outline, eligibility requirements and recommended references.','Free official handbook'),
           ('Neuro Pathway CNIM Prep Classes','https://myneuropathway.com/cltm-prep-courses/','Free CNIM preparation sessions covering intraoperative monitoring topics. Check for future class dates and available seats; older event listings may be closed.','Free scheduled classes'),
           ('ASET IONM Competency Standards','https://www.aset.org/national-competency-skill-standards/','Select Intraoperative Neurophysiologic Monitoring to review the professional knowledge and technical competencies relevant to CNIM preparation.','Free professional standards')]
          cnimpaid=[
           ('ABRET ASAP for CNIM','https://abret.org/asap','Select the CNIM assessment when purchasing access. Official ABRET practice assessments to identify strengths and areas for further study.','Paid self assessment'),
           ('ASET Intraoperative Neuromonitoring Flashcards','https://www.aset.org/flashcards/','Select the Intraoperative Neuromonitoring flashcards. Paid questions and answers covering monitoring modalities, anatomy, anesthesia, instrumentation and operating room safety.','Paid physical flashcards')]
          def section(id,title,desc,free,paid,freeid,paidid):
           def subgroup(label,id,cards,cost):return '<section class="column"><div class="sectionhead"><div><h3>'+label+'</h3></div></div><div class="entries" data-registry-cost="'+cost+'" id="'+id+'">'+cards+'</div></section>'
           return '<section class="registry-credential" id="'+id+'" aria-labelledby="'+id+'-heading"><div class="registry-credential-heading"><h2 id="'+id+'-heading">'+title+'</h2><p>'+desc+'</p></div><div class="grid">'+subgroup('FREE RESOURCES',freeid,free,'free')+subgroup('PAID / ENROLLMENT RESOURCES',paidid,paid,'paid')+'</div></section>'
          nav='<nav class="registry-credential-nav" aria-label="Registry credential sections"><button type="button" data-registry-jump="registry-eeg">R. EEG T.</button><button type="button" data-registry-jump="registry-cltm">CLTM</button><button type="button" data-registry-jump="registry-cnim">CNIM</button></nav>'
          new=prefix+nav+section('registry-eeg','R. EEG T.','EEG examination preparation, study guides and foundational EEG learning.',free,paid,'registry-free','registry-paid')
          for key,title,desc,f,pa in [('cltm','CLTM','Long term monitoring examination preparation for epilepsy and continuous EEG monitoring.',cltmfree,cltmpaid),('cnim','CNIM','Neurophysiologic intraoperative monitoring examination preparation.',cnimfree,cnimpaid)]:
           new+=section('registry-'+key,title,desc,''.join(card(*x) for x in f),''.join(card(*x) for x in pa),'registry-'+key+'-free','registry-'+key+'-paid')
          new+='<p class="footer">Use the current ABRET handbook for your intended credential to guide preparation. Third party resources are independent study options. Course availability, eligibility and pricing can change.</p></main>'
          s=s[:start]+new+s[end:]
          # Expand existing paging and resource indexing to all credential groups.
          setup="setup('registry-free');setup('registry-paid')"
          s=s.replace(setup,setup+";setup('registry-cltm-free');setup('registry-cltm-paid');setup('registry-cnim-free');setup('registry-cnim-paid')")
          s=s.replace("selector:'#registry-free .entry,#registry-paid .entry'","selector:'#registry-prep-view .entry'")
          s=s.replace("el.closest('#registry-free')?'free':el.closest('#registry-paid')?'paid':'all'","el.closest('[data-registry-cost]')?.dataset.registryCost||'all'")
          style='''<style id="registry-credential-layout">
          #registry-prep-view .registry-credential-nav{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
          #registry-prep-view .registry-credential-nav button{cursor:pointer;font:inherit;padding:10px 18px;background:#10352e;border:1px solid #416b64;border-radius:8px;color:#eaf5ed;font-weight:700;text-decoration:none}
          #registry-prep-view .registry-credential{margin:0 0 30px;scroll-margin-top:22px}
          #registry-prep-view .registry-credential-heading{padding:22px;background:#0c2d44;border:1px solid #31566c;border-left:5px solid #69be28;border-radius:10px;margin-bottom:14px}
          #registry-prep-view .registry-credential-heading h2{margin:0 0 6px;color:#f5f9fc;font-size:25px}
          #registry-prep-view .registry-credential-heading p{margin:0;color:#c5d9e4;line-height:1.5}
          #registry-prep-view .registry-credential>.grid{display:flex;flex-direction:column;gap:18px;margin:0}
          #registry-prep-view .registry-credential .column{width:100%;min-width:0}
          #registry-prep-view .registry-credential .sectionhead h3{margin:0;color:#69be28;font-size:16px}
          </style>'''
          s=s.replace('</head>',style+'</head>',1)
          s=s.replace('</body>',"<script>document.querySelectorAll('[data-registry-jump]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.registryJump)?.scrollIntoView({behavior:'smooth',block:'start'})));</script></body>",1)
          p.write_text(s)
          Path('data/registry-credential-resources.json').write_text(json.dumps(dict(checked='2026-11-05',credentials={'CLTM':{'free':cltmfree,'paid':cltmpaid},'CNIM':{'free':cnimfree,'paid':cnimpaid}},notes='R. EEG T. existing resources retained. Repeated provider links within different credential sections are intentional.'),indent=2))
          print('Created stacked R. EEG T., CLTM and CNIM groups.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/registry-credential-resources.json
          git diff --cached --quiet || git commit -m 'Organize registry preparation by credential with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
