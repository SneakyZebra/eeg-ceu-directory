name: Update Conferences introduction
on:
  push:
    paths:
      - '.github/workflows/update-conferences-intro.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Replace Conferences introduction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="Major meetings and professional organizations for EEG, epilepsy, neurology and neurophysiology. Check the official organizer for current dates, registration and CEU eligibility."
          new="Explore conferences, professional meetings, and educational events in EEG, epilepsy, neurology, and neurophysiology. Visit each organization's official website for the latest event dates, registration details, and continuing education opportunities. Please independently verify CEU eligibility before attending."
          assert old in s or new in s, 'Expected Conferences introduction was not found'
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update Conferences introduction with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
