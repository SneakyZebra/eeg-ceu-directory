name: Daily EEG priority source discovery
on:
  push:
    paths:
      - '.github/workflows/daily-priority-source-discovery.yml'
      - 'scripts/discover_priority_sources.py'
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find educational resource candidates
        run: python scripts/discover_priority_sources.py
      - name: Commit discovery report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/priority_source_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh EEG priority education source candidates"
            git push
          fi
