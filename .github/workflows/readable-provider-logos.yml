name: Improve provider logo readability
on:
  push:
    paths:
      - '.github/workflows/readable-provider-logos.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  logos:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install Pillow
      - name: Trim logo whitespace and enlarge icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,base64,io,subprocess
          from PIL import Image,ImageChops
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'(<script id="eeg-logo-data" type="application/json">)(.*?)(</script>)',s,re.S)
          logos=json.loads(m.group(2))
          original=subprocess.check_output(['git','show','afde85bd3bdb70e353c00474f776b5ef8e0c2931:index.html'],text=True)
          original_logos=json.loads(re.search(r'<script id="eeg-logo-data" type="application/json">(.*?)</script>',original,re.S).group(1))
          logos['myneuropathway.com']=original_logos['myneuropathway.com']
          for key,value in logos.items():
              if not value.startswith('data:image/'): continue
              im=Image.open(io.BytesIO(base64.b64decode(value.split(',',1)[1]))).convert('RGBA')
              white=Image.new('RGBA',im.size,'white')
              visible=Image.alpha_composite(white,im).convert('RGB')
              diff=ImageChops.difference(visible,Image.new('RGB',im.size,'white'))
              mask=diff.convert('L').point(lambda x:255 if x>15 else 0)
              box=im.getchannel('A').getbbox() if key=='myneuropathway.com' else mask.getbbox()
              if not box: box=im.getchannel('A').getbbox()
              if not box: continue
              im=im.crop(box)
              # Opaque white preserves dark lettering and removes the pale tile tint.
              out=Image.new('RGBA',im.size,'#08243b' if key=='myneuropathway.com' else 'white')
              out.alpha_composite(im)
              buffer=io.BytesIO()
              out.convert('RGB').save(buffer,format='PNG',optimize=True)
              logos[key]='data:image/png;base64,'+base64.b64encode(buffer.getvalue()).decode()
          s=s[:m.start(2)]+json.dumps(logos,separators=(',',':'))+s[m.end(2):]
          css='''<style id="readable-provider-logos">
          .entry .logo {width:88px!important;height:88px!important;min-width:88px!important;padding:2px!important;background:#fff!important;border-color:#7895a6!important;flex-shrink:0;}
          .entry .logo img {width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;filter:contrast(1.18);border-radius:3px;}
          @media(max-width:650px){.entry .logo {width:72px!important;height:72px!important;min-width:72px!important;flex-basis:72px!important;}}
          @media(max-width:390px){.entry .logo {width:64px!important;height:64px!important;min-width:64px!important;flex-basis:64px!important;}}
          </style>
          '''
          if 'id="readable-provider-logos"' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enlarge provider icons and trim excess logo whitespace'
          git push
      - run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
