name: Repair scholarship resource link
on:
  push:
    paths:
      - '.github/workflows/repair-scholarship-resource-link.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Add verified public EEG videos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html');s=p.read_text()
          assert 'https://www.aset.org/foundation/' in s
          s=s.replace('https://www.aset.org/foundation/','https://asetfoundation.org/scholarships/')
          p.write_text(s)
          p=Path('data/resource-review-2026-11-05.json')
          d=json.loads(p.read_text())
          d['link_audit']={'total':74,'reachable':69,'fixed_404':'ASET Foundation scholarship link','unconfirmed':['https://eegmaster.com/','https://eegpedia.org/index.php?title=Main_Page','https://eegplatform.com/','https://pocketneurodiagnostics.com/'],'note':'Four servers returned 406 or 503 to the automated check; this does not establish that the resource is unavailable to visitors.'}
          p.write_text(json.dumps(d,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/resource-review-2026-11-05.json
          git diff --cached --quiet || git commit -m 'Repair scholarship resource link with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
