name: Publish current learning hub
on:
  push:
    paths:
      - '.github/workflows/publish-current-learning-hub.yml'
      - 'index.html'
      - 'ceu-offerings.json'
      - 'data/**'
      - '*.js'
      - '*.css'
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily EEG CEU Check', 'Daily EEG priority source discovery']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clear failed stale deployment
        uses: actions/github-script@v7
        with:
          script: |
            const id='8e326a4ff89e282d556722289b40f6ec4caee6c7';
            try {
              const result=await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',{...context.repo,pages_deployment_id:id});
              core.info('Prior deployment status: '+result.data.status);
              if(!['succeed','failure','cancelled','deployment_cancelled','deployment_failed'].includes(result.data.status)){
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',{...context.repo,pages_deployment_id:id});
                core.info('Cancelled stale deployment');
                await new Promise(resolve=>setTimeout(resolve,30000));
              }
            } catch(error) {if(error.status!==404)throw error;}
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
