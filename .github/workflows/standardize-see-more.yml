name: Standardize resource expansion buttons
on:
  push:
    paths:
      - '.github/workflows/standardize-see-more.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-resource-review
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Show More with remaining counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths=['index.html','assets/general-education-pagination.js','assets/eeg-literature-search.js']
          for name in paths:
              p=Path(name);s=p.read_text()
              assert any(label in s for label in ['See More (','Show 6 More (','Show More (']), 'Missing expansion label: '+name
              s=s.replace('See More (','Show More (').replace('Show 6 More (','Show More (')
              if name=='index.html':
                  for asset in ['general-education-pagination','eeg-literature-search']:
                      pattern=r'assets/'+asset+r'\.js\?v=[^\x22]+'
                      s,n=re.subn(pattern,'assets/'+asset+'.js?v=20261107-show-more',s)
                      assert n==1,(asset,n)
              assert 'See More (' not in s and 'Show 6 More (' not in s
              p.write_text(s)
          print('All expansion labels now read Show More followed by the remaining count.')
          PY
          node --check assets/general-education-pagination.js
          node --check assets/eeg-literature-search.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/general-education-pagination.js assets/eeg-literature-search.js
          git diff --cached --quiet || git commit -m 'Use Show More labels with remaining counts'
          git pull --rebase origin main
          git push
      - name: Publish through the existing learning hub publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
