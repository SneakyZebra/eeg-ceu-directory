name: Standardize resource expansion buttons
on:
  push:
    paths:
      - '.github/workflows/standardize-see-more.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-resource-review
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Show the remaining resource count on all See More buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          old="button.textContent='See More';"
          new="button.textContent='See More ('+remaining.toLocaleString()+' remaining)';"
          assert s.count(old)+s.count(new)==1, 'Expected one shared registry expansion label'
          s=s.replace(old,new)
          s=s.replace('assets/general-education-pagination.js?v=20261106','assets/general-education-pagination.js?v=20261107-counts')
          s=s.replace('assets/eeg-literature-search.js?v=20261107"','assets/eeg-literature-search.js?v=20261107-counts"')
          old_tail="visible=Math.min(count,visible+limit);update();\n   });update();"
          new_tail="visible=Math.min(count,visible+limit);update();\n   });\n   new MutationObserver(update).observe(host,{childList:true});\n   update();"
          assert old_tail in s or new_tail in s, 'Registry pagination shape changed'
          s=s.replace(old_tail,new_tail)
          p.write_text(s)
          
          p=Path('assets/general-education-pagination.js');s=p.read_text()
          old="button.style.display=entries.length>visible?'block':'none';"
          new="const remaining=Math.max(0,entries.length-visible);\n      button.textContent='See More ('+remaining.toLocaleString()+' remaining)';\n      button.style.display=remaining>0?'block':'none';"
          assert old in s or new in s, 'General Education pagination shape changed'
          s=s.replace(old,new).replace("    button.textContent='See More';\n","")
          p.write_text(s)
          
          p=Path('assets/eeg-literature-search.js');s=p.read_text()
          old="const more=el('button','els-more','See More');"
          new="const more=el('button','els-more','See More ('+Math.max(0,state.total-state.items.length).toLocaleString()+' remaining)');"
          assert old in s or new in s, 'Article search pagination shape changed'
          p.write_text(s.replace(old,new))
          print('Added remaining counts to every shared registry, General Education and article search expansion button.')
          PY
          node --check assets/general-education-pagination.js
          node --check assets/eeg-literature-search.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/general-education-pagination.js assets/eeg-literature-search.js
          git diff --cached --quiet || git commit -m 'Show remaining resource counts on all See More buttons'
          git pull --rebase origin main
          git push
      - name: Publish through the existing learning hub publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
