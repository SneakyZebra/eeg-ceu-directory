name: Complete provider logo enforcement
on:
  push:
    paths:
      - '.github/workflows/complete-provider-logo-enforcement.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Complete provider logo enforcement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          script="<script id=\"force-provider-logos\">\n(function(){\nconst library=JSON.parse(document.getElementById('eeg-logo-data').textContent);\nconst aliases={'stratusneuro.zoom.us':'stratusneuro.com'};\nfunction logoFor(host){\nhost=aliases[host]||host;\nconst exact=library[host]||library[host.replace(/^www\\\\./,'')]||library['www.'+host];\nif(exact)return exact;\nconst parts=host.split('.');\nwhile(parts.length>2){parts.shift();const h=parts.join('.');if(library[h]||library['www.'+h])return library[h]||library['www.'+h];}\nreturn '';\n}\nfunction apply(card){\nconst link=card.querySelector('a[href^=\"http\"]');if(!link)return;\nconst image=card.querySelector('.logo img,.eeg-video-mark img,.eeg-video-brand img,.conference-logo');if(!image)return;\nconst host=new URL(link.href).hostname;\nif(image.dataset.providerHost===host)return;\nimage.dataset.providerHost=host;\nconst src=logoFor(host)||new URL('/favicon.ico',link.href).href;\nimage.onerror=null;image.src=src;image.alt=(card.querySelector('strong,h3')?.textContent||host)+' logo';\n}\ndocument.addEventListener('error',function(e){\nconst image=e.target;\nif(!(image instanceof HTMLImageElement)||!image.dataset.providerHost)return;\ne.stopImmediatePropagation();\nconst box=image.closest('.logo,.eeg-video-mark,.eeg-video-brand');\nif(box)box.hidden=true;else image.hidden=true;\n},true);\nfunction scan(){document.querySelectorAll('.entry,.eeg-video-card,.conference-card').forEach(apply);}\nfunction init(){scan();new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n</script>"
          s,count=re.subn(r'<script id="force-provider-logos">.*?</script>',lambda m:script,s,flags=re.S)
          assert count==1, 'Provider logo enforcement script not found'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Complete provider logo enforcement with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
