name: Use official provider logos
on:
  push:
    paths:
      - '.github/workflows/official-provider-logos.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  logos:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Trim logo whitespace and enlarge icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,base64,io,urllib.request,concurrent.futures
          from PIL import Image,ImageChops
          p=Path('index.html')
          s=p.read_text()
          m=re.search(r'(<script id="eeg-logo-data" type="application/json">)(.*?)(</script>)',s,re.S)
          logos=json.loads(m.group(2))
          for bad_host in ['www.stratusneuro.com','stratusneuro.com','neurodiagnosticniche.com','www.neurodiagnosticniche.com']:
              logos.pop(bad_host,None)
          urls=json.loads("{\"www.teamngn.com\":\"https://images.squarespace-cdn.com/content/v1/5da62a583a2bd04688ad1455/1591384402696-RZHJ1QD3YDIVG5IH0BN9/Logo.png?format=1500w\",\"tstelemed.com\":\"https://tstelemed.com/wp-content/themes/medicom-child/dist/assets/images/tele-logo.png\",\"epi-care.eu\":\"https://epi-care.eu/wp-content/uploads/2021/02/cropped-Image3-1-300x300.png\",\"www.asnm.org\":\"https://asnm.org/wp-content/uploads/2023/03/logo.webp\",\"www.neuromodulation.org\":\"https://www.nans.org/wp-content/themes/neuromodulation/images/logo.png\",\"learningeeg.com\":\"https://learningeeg.com/LEEG%20Icon.png\",\"nowyouknowmed.com\":\"https://nowyouknowmed.com/_next/image?url=%2Fimages%2Flogos%2Fnowyouknowmed-logo-banner.png&w=640&q=75&dpl=dpl_BKVxvgqx7WyzCTuuT7jDN8jm1w3z\",\"studyeegonline.com\":\"https://studyeegonline.com/pluginfile.php/1/theme_boost_union/logocompact/300x300/1793566874/Study%20EEG%20Logo.jpg\",\"www.holbergeeg.com\":\"https://static.wixstatic.com/media/f33aa7_1a48ca2d3b0e43c7852d2e61c31639a6~mv2.png/v1/fill/w_216,h_54,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/HolbergEEG_LOGO.png\",\"www.neurotecheeginstitute.com\":\"https://www.neurotecheeginstitute.com/images/uploads/neurotech-institute-small-logo.png\",\"www.epilepsydiagnosis.org\":\"https://www.epilepsydiagnosis.org/img/ED-logo.png\"}")
          def download(item):
              host,url=item
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  raw=urllib.request.urlopen(req,timeout=30).read()
                  im=Image.open(io.BytesIO(raw)).convert('RGBA')
                  # Dark backing preserves white lettering in transparent provider artwork.
                  alpha=im.getchannel('A')
                  opaque=alpha.getextrema()[0]>240
                  pixels=[(r,g,b) for r,g,b,a in im.getdata() if a>220]
                  light=sum((r+g+b)/3 for r,g,b in pixels)/max(1,len(pixels))>175
                  bg='#08243b' if not opaque and light else '#ffffff'
                  canvas=Image.new('RGBA',im.size,bg)
                  canvas.alpha_composite(im)
                  rgb=canvas.convert('RGB')
                  mask=ImageChops.difference(rgb,Image.new('RGB',im.size,bg)).convert('L').point(lambda x:255 if x>15 else 0)
                  box=mask.getbbox()
                  if box:rgb=rgb.crop(box)
                  rgb.thumbnail((600,600),Image.Resampling.LANCZOS)
                  out=io.BytesIO();rgb.save(out,format='PNG',optimize=True)
                  return host,'data:image/png;base64,'+base64.b64encode(out.getvalue()).decode()
              except Exception as e:
                  print('Unavailable:',host,str(e))
                  return host,None
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for host,data in pool.map(download,urls.items()):
                  if data:
                      logos[host]=data
                      logos[host.removeprefix('www.')]=data
                      logos['www.'+host.removeprefix('www.')]=data
          for host,data in list(logos.items()):
              logos.setdefault(host.removeprefix('www.'),data)
              logos.setdefault('www.'+host.removeprefix('www.'),data)
          s=s[:m.start(2)]+json.dumps(logos,separators=(',',':'))+s[m.end(2):]
          p.write_text(s)
          print('Cached logos for',len(logos),'domain variants')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Replace brain placeholders with verified official provider logos'
          git push
      - run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
