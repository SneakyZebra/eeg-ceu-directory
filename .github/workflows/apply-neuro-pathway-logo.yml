name: Apply cleaned Neuro Pathway logo
on:
  push:
    paths:
      - '.github/workflows/apply-neuro-pathway-logo.yml'
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update provider library and hosted video matching
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html');s=p.read_text()
          pattern=r'(<script[^>]*id=["\x27]eeg-logo-data["\x27][^>]*>)(.*?)(</script>)'
          m=re.search(pattern,s,re.S)
          assert m,'Provider logo library missing'
          library=json.loads(m.group(2))
          for host in ['myneuropathway.com','www.myneuropathway.com']:
              library[host]='assets/neuro-pathway-clean.svg'
          s=s[:m.start(2)]+json.dumps(library,separators=(',',':'))+s[m.end(2):]
          old="card.querySelector('strong,h3')?.textContent.startsWith('Neuro Pathway:')"
          new="/neuro\\s*pathway/i.test(card.querySelector('strong,h3')?.textContent||'')"
          assert old in s,'Provider title matcher changed'
          s=s.replace(old,new)
          p.write_text(s)
          print('Updated Neuro Pathway library aliases and all title matches')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply cleaned logo to every Neuro Pathway resource'
          git push
      - name: Publish current hub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
