name: Review all EEG Learning Hub tabs
on:
  push:
    paths:
      - '.github/workflows/review-all-learning-hub-tabs.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-resource-review
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply evidence reviewed resources
        run: |
          python -m py_compile scripts/add_requested_five_sources.py
          python scripts/add_requested_five_sources.py
          python -m py_compile scripts/add_requested_five_sources.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/discovered_providers.json data/requested-five-sources-2026-11-06.json
          git diff --cached --quiet || git commit -m 'Add requested society and academic EEG learning resources'
          git pull --rebase origin main
          git push
      - name: Publish through existing hub configuration
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
