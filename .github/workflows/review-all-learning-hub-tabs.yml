name: Review all EEG Learning Hub tabs
on:
  push:
    paths:
      - '.github/workflows/review-all-learning-hub-tabs.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-resource-review
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply evidence reviewed resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text()
          pattern=r'<details[^>]*data-finder="general-education"[^>]*>.*?</details>'
          s,n=re.subn(pattern,'<section id="eeg-literature-search" aria-label="EEG literature search"></section>',s,flags=re.S)
          assert n==1,('Expected one General Education Finder',n)
          tag='<script src="assets/eeg-literature-search.js?v=20261107"></script>'
          if tag not in s:s=s.replace('</body>',tag+'\n</body>',1)
          assert 'General Education Finder' not in s
          assert 'assets/general-education-pagination.js' in s
          p.write_text(s)
          print('Replaced General Education Finder with EEG literature search')
          PY
          node --check assets/eeg-literature-search.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Replace General Education Finder with EEG keyword and subject search'
          git pull --rebase origin main
          git push
      - name: Publish through existing hub configuration
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
