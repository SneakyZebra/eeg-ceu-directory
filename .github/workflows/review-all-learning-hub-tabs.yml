name: Review all EEG Learning Hub tabs
on:
  push:
    paths:
      - '.github/workflows/review-all-learning-hub-tabs.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: editorial-resource-review
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply evidence reviewed resources
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          tag='<script src="assets/general-education-pagination.js?v=20261106"></script>'
          assert 'id="general"' in s
          if tag not in s:
              assert '</body>' in s
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s)
          print('General Education pagination script loaded')
          PY
          node --check assets/general-education-pagination.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show ten General Education resources with five more per click'
          git pull --rebase origin main
          git push
      - name: Publish through existing hub configuration
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
