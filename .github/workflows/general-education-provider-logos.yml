name: Arrange General Education and enforce provider logos
on:
  push:
    paths:
      - '.github/workflows/general-education-provider-logos.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  logos:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Trim logo whitespace and enlarge icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,base64,io,urllib.request,concurrent.futures
          from PIL import Image,ImageChops
          p=Path('index.html');s=p.read_text()
          # Move the current introduction without restoring outdated screenshot wording.
          pattern=r'(<main[^>]*id="general-education-view"[^>]*>)(.*?)(</main>)'
          m=re.search(pattern,s,re.S);assert m
          body=m.group(2)
          note=re.search(r'<div class="general-education-note">.*?</div>',body,re.S);assert note
          body=note.group(0)+body[:note.start()]+body[note.end():]
          s=s[:m.start(2)]+body+s[m.end(2):]
          m=re.search(r'(<script id="eeg-logo-data" type="application/json">)(.*?)(</script>)',s,re.S)
          logos=json.loads(m.group(2))
          urls=json.loads("{\"medicine.yale.edu\":\"https://cdn1.medicine.yale.edu/icons/ysm/apple-touch-icon.png\",\"campuspress.yale.edu\":\"https://campuspress.yale.edu/files/2023/05/favicon.ico\",\"sites.rutgers.edu\":\"https://sites.rutgers.edu/android-chrome-192x192.png\",\"www.udemy.com\":\"https://frontends.udemycdn.com/frontends-homepage/staticx/udemy/images/v7/apple-touch-icon.png\",\"nowyouknowmed.com\":\"https://nowyouknowmed.com/images/logos/nowyouknowmed-logo-banner.png\",\"www.aan.com\":\"https://www.aan.com/favicon.ico\",\"pocketneurodiagnostics.com\":\"https://pocketneurodiagnostics.com/favicon.ico\",\"eegpedia.org\":\"https://eegpedia.org/favicon.ico\",\"eegatlas-online.com\":\"https://eegatlas-online.com/favicon.ico\",\"eegplatform.com\":\"https://eegplatform.com/favicon.ico\"}")
          def get(item):
              host,url=item
              try:
                  raw=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18).read()
                  im=Image.open(io.BytesIO(raw)).convert('RGBA')
                  pixels=[(r,g,b) for r,g,b,a in im.getdata() if a>220]
                  light=sum((r+g+b)/3 for r,g,b in pixels)/max(1,len(pixels))>175
                  bg='#08243b' if im.getchannel('A').getextrema()[0]<240 and light else '#ffffff'
                  canvas=Image.new('RGBA',im.size,bg);canvas.alpha_composite(im)
                  rgb=canvas.convert('RGB')
                  mask=ImageChops.difference(rgb,Image.new('RGB',im.size,bg)).convert('L').point(lambda x:255 if x>15 else 0)
                  box=mask.getbbox()
                  if box:rgb=rgb.crop(box)
                  rgb.thumbnail((600,600),Image.Resampling.LANCZOS)
                  out=io.BytesIO();rgb.save(out,format='PNG',optimize=True)
                  return host,'data:image/png;base64,'+base64.b64encode(out.getvalue()).decode()
              except Exception as e:
                  print('Logo unavailable:',host,str(e));return host,None
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              for host,data in pool.map(get,urls.items()):
                  if data:
                      logos[host]=data;logos[host.removeprefix('www.')]=data;logos['www.'+host.removeprefix('www.')]=data
          s=s[:m.start(2)]+json.dumps(logos,separators=(',',':'))+s[m.end(2):]
          script="<script id=\"force-provider-logos\">\n(function(){\nfunction logoFor(h){const d=JSON.parse(document.getElementById('eeg-logo-data').textContent);return d[h]||d[h.replace(/^www\\\\./,'')]||d['www.'+h];}\nfunction apply(card){\nconst link=card.querySelector('a[href^=\"http\"]');if(!link)return;\nconst host=new URL(link.href).hostname;\nconst image=card.querySelector('.logo img,.eeg-video-mark img,.eeg-video-brand img,.conference-logo');if(!image)return;\nconst src=logoFor(host);if(!src)return;\nif(image.getAttribute('src')!==src){image.onerror=null;image.setAttribute('src',src);image.alt=(card.querySelector('strong,h3')?.textContent||host)+' logo';}\n}\nfunction scan(){document.querySelectorAll('.entry,.eeg-video-card,.conference-card').forEach(apply);}\nfunction init(){scan();new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n</script>"
          if 'id="force-provider-logos"' not in s:s=s.replace('</body>',script+'</body>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Replace brain placeholders with verified official provider logos'
          git push
      - run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
