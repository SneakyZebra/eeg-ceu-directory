name: Apply responsive Learning Hub layout
on:
  push:
    paths:
      - '.github/workflows/apply-responsive-layout.yml'
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load responsive stylesheet after existing styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          link='<link rel="stylesheet" href="learning-hub-responsive.css?v=20261106">'
          assert '</head>' in s
          s=s.replace(link,'')
          s=s+'\n'+link+'\n'
          p.write_text(s)
          assert s.index(link)>s.rfind('</style>')
          print('Responsive stylesheet loaded after embedded styles')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load responsive conference and resource layouts'
          git push
      - name: Publish current hub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'publish-current-learning-hub.yml',ref:'main'});
