name: Update Registry Prep introduction
on:
  push:
    paths:
      - '.github/workflows/update-registry-prep-intro.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Replace Registry Prep introduction
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="Study guides, practice questions, and learning resources for the R. EEG T. examination. Explore free and paid options below."
          new="Prepare for the registry examination with a variety of study guides, practice questions, educational materials, and exam preparation resources. Explore both complimentary and paid options to support your learning and help build confidence as you work toward certification."
          assert old in s or new in s, 'Expected Registry Prep introduction was not found'
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update Registry Prep introduction with requested paragraph'
          git push
      - name: Prepare public site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
